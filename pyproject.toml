[project]
name = "failure-on-the-fly"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.7",
    "django-htmx>=1.27.0",
    "httpx>=0.28.1",
    # litellm ab 1.92 bringt einen Rust-Teil mit und liefert für Linux nur
    # Wheels für glibc ≥ 2.28; auf dem Produktivserver (glibc 2.17) müsste
    # sonst aus dem Quellpaket gebaut werden, was am alten GCC scheitert.
    "litellm>=1.84.0,<1.92",
    "markdown-it-py>=4.0.0",
    "pillow>=12.1.1",
    "python-dotenv>=1.1.1",
]

[dependency-groups]
deploy = [
    "gunicorn>=23.0.0",
]
dev = [
    "django-stubs>=6.1.2",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.20",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
# Parallel über pytest-xdist. `loadscope` hält eine Testklasse auf einem
# Worker, sonst baut jeder Worker ihr setUpTestData erneut auf. Mehr als vier
# Worker bringen kaum Zeit, kosten aber CPU, vor allem wenn Sandcastle mehrere
# Agents gleichzeitig testen lässt. Seriell, schneller für einzelne Dateien:
# `pytest -n 0`.
addopts = "-n 4 --dist loadscope"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
# Ruff 0.16 hat seinen Standard-Regelsatz erweitert; wir übernehmen ihn nicht und
# wählen die Regeln einzeln.
# ANN und D1 erzwingen Typ-Hinweise und Docstrings öffentlicher Objekte. Die
# Stilregeln D2/D4 bleiben aus, damit Kommentare nach der def-Zeile erlaubt sind.
# SLF001 und PLC2701 verbieten Zugriffe auf private Attribute und Importe
# privater Namen, im Produktionscode wie in Tests (#321).
select = ["E4", "E7", "E9", "F", "ANN", "D1", "SLF001", "PLC2701"]
# Any bleibt erlaubt, wo es gewollt ist.
ignore = ["ANN401"]
# PLC2701 gibt es in Ruff 0.16 nur als Preview. explicit-preview-rules hält
# alle übrigen Preview-Regeln draußen; der Formatter bleibt unberührt.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.flake8-self]
# _meta ist Djangos öffentliche Modell-API, trotz Unterstrich.
extend-ignore-names = ["_meta"]

[tool.ruff.lint.per-file-ignores]
# Tests und generierte Migrationen brauchen keine Docstrings.
"**/tests/**" = ["D1"]
# Migrationen werden nach ADR-0031 nicht mehr angefasst; historische laden
# private Trigger-SQL-Konstanten früherer Migrationen.
"**/migrations/**" = ["D1", "SLF001", "PLC2701"]
# Übergangsliste (#321): Bestandstreffer von SLF001, dateiweise statt per Glob,
# damit neue Dateien der Regel sofort unterliegen. Die Liste wird nur kürzer;
# die Umsetzungstickets zu den Testreviews streichen bereinigte Dateien.
"config/tests/test_eigentuemerinnen_abschnitt.py" = ["SLF001"]
"config/tests/test_seitenvokabular.py" = ["SLF001"]
"erhebungen/tests/test_teilnahme.py" = ["SLF001"]
"erhebungen/tests/test_transkription.py" = ["SLF001"]
"fragebogen_items/tests/test_fragebogen_item_models.py" = ["SLF001"]
"konten/tests/test_model.py" = ["SLF001"]
"training/tests/test_beitritt.py" = ["SLF001"]
"training/tests/test_katalog.py" = ["SLF001"]
"training/tests/test_models.py" = ["SLF001"]
"training/tests/test_sitzung.py" = ["SLF001"]
"training/tests/test_transkription.py" = ["SLF001"]
"training/tests/test_views.py" = ["SLF001"]
"vignetten/tests/test_views.py" = ["SLF001"]
"vignetten/tests/test_vignetten_models.py" = ["SLF001"]

[tool.ruff.format]
# Django generiert Migrationen; ihr Umbruch ist nicht unsere Entscheidung.
# Der Linter prüft sie weiterhin, nur der Formatter lässt sie in Ruhe.
# Ruff 0.16 formatiert auch Codeblöcke in Markdown; die ADRs bleiben unberührt.
exclude = ["**/migrations/**", "**/*.md"]

[tool.ty.src]
# Migrationen generiert Django; ihre Typen prüft ty nicht.
exclude = ["**/migrations/**"]
