{% load static %}{# PROTOTYPE #288 · Variante A: große Ablagezone, vorhandenes Bild füllt die Zone. #}
<div class="bf bf-a vignette-field" x-data="bildfeld({zustand: '{{ zustand }}', gespeichert: {{ gespeichert|yesno:'true,false' }}, bild: '{% static 'images/prototype-bildfeld/lernauftrag.png' %}', verloren: '{{ verloren|escapejs }}'})" :data-zustand="zustand">
    <label for="{{ feld }}">Lernauftrag Bild</label>
    <input class="bf__eingabe" type="file" accept="image/*" id="{{ feld }}" name="{{ feld }}" x-ref="eingabe" @change="gewaehlt($el)" aria-describedby="{{ feld }}-status">
    <input type="checkbox" hidden name="{{ feld }}-clear" :checked="wirdEntfernt">

    <div class="bf-a__zone" :class="{ 'ist-ziehen': ziehen, 'hat-bild': bildUrl }"
         @dragover.prevent="ziehen = true" @dragleave="ziehen = false" @drop.prevent="abgelegt($event)">
        <template x-if="!bildUrl">
            <label for="{{ feld }}" class="bf-a__leer">
                <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
                <strong>Bild hierher ziehen oder <u>auswählen</u></strong>
                <small>PNG, JPG, GIF oder WebP</small>
            </label>
        </template>
        <template x-if="bildUrl">
            <figure class="bf-a__bild">
                <img :src="bildUrl" alt="">
                <span class="bf__status" x-text="statusText"></span>
            </figure>
        </template>
        <p class="bf-a__ablegen" x-show="ziehen" aria-hidden="true">Loslassen, um das Bild zu übernehmen</p>
    </div>

    <div class="bf__leiste" x-show="bildUrl">
        <span class="bf__name" x-text="anzeigename"></span>
        <span class="bf__aktionen">
            <template x-if="istNeu">
                <span><button type="button" class="button button--secondary" @click="auswaehlen()">Andere Datei</button>
                <button type="button" class="bf__link" @click="verwerfen()">Auswahl verwerfen</button></span>
            </template>
            <template x-if="!istNeu && !wirdEntfernt">
                <span><button type="button" class="button button--secondary" @click="auswaehlen()">Ersetzen</button>
                <button type="button" class="bf__link bf__link--gefahr" @click="entfernen()">Entfernen</button></span>
            </template>
            <template x-if="wirdEntfernt">
                <button type="button" class="button button--secondary" @click="behalten()">Rückgängig</button>
            </template>
        </span>
    </div>
    <p class="bf__meldung" :class="{ 'ist-fehler': istFehler }" id="{{ feld }}-status" role="status" x-text="meldung"></p>
</div>
