{% if teil.text_vor_bild %}
    <p class="aufgabenkontext-inhalt">{{ teil.text_vor_bild }}</p>
{% endif %}
{% if teil.bild %}
    <img class="aufgabenkontext-bild" src="{{ teil.bild.url }}" alt="{{ teil.bildbeschreibung|default:'Abbildung ohne Bildbeschreibung' }}">
{% endif %}
{% if teil.text_nach_bild %}
    <p class="aufgabenkontext-inhalt">{{ teil.text_nach_bild }}</p>
{% endif %}
