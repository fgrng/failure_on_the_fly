{% comment %}
Die Karte mit dem Teilnahme-Token auf der Abschlussseite; `hinweis` sagt, was
sich damit holen lässt.
{% endcomment %}
<div class="card card--participant">
    <div class="card__header">
        <h3>Ihr Teilnahme-Token</h3>
    </div>
    <div class="card__body">
        <p class="abschrift-token">{{ teilnahme_token }}</p>
        <p>{{ hinweis }}</p>
        <p><a href="{% url 'training:abschriften' %}">Zur Token-Eingabe</a></p>
    </div>
</div>
