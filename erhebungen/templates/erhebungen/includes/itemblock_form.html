{# Die Klassen sitzen in dieser Teilvorlage, weil htmx sie per outerHTML tauscht. #}
<form
    class="form"
    method="post"
    action="{% url 'erhebungen:itemblock' token %}"
    id="itemblock-formular"
    hx-post="{% url 'erhebungen:itemblock' token %}"
    hx-trigger="change"
    hx-target="#itemblock-formular"
    hx-swap="outerHTML"
>
    {% csrf_token %}
    {% for feld in formular %}
        <fieldset class="page-fieldset page-choices">
            <legend>{{ feld.label }}</legend>
            {{ feld }}
        </fieldset>
    {% endfor %}
    <div class="vignette-form-actions">
        <button class="button" type="submit" name="weiter" value="ja">Weiter</button>
    </div>
</form>
