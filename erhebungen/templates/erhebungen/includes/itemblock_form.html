<form
    method="post"
    action="{% url 'erhebungen:itemblock' token %}"
    id="itemblock-formular"
    hx-post="{% url 'erhebungen:itemblock' token %}"
    hx-trigger="change"
    hx-target="#itemblock-formular"
    hx-swap="outerHTML"
>
    {% csrf_token %}
    {% for feld in formular %}
        <fieldset>
            <legend>{{ feld.label }}</legend>
            {{ feld }}
        </fieldset>
    {% endfor %}
    <button type="submit" name="weiter" value="ja">Weiter</button>
</form>
