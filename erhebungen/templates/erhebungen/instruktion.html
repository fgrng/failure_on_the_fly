{% extends "base.html" %}
{% load static %}

{% block title %}Instruktion{% endblock %}

{% block extra_head %}
    <link rel="stylesheet" href="{% static 'css/vignette-form.css' %}">
{% endblock %}

{% block content %}
<section class="page area--participant">
    <header class="page-head">
        <div>
            <p>Erhebung</p>
            <h1>Instruktion</h1>
        </div>
    </header>

    <section class="page-section" aria-labelledby="section-instruktion">
        <header class="page-section__head">
            <b>01</b><span><h2 id="section-instruktion">Vor dem Beginn</h2></span>
        </header>
        <div class="page-field">
            <p class="prose">{{ erhebung.instruktionstext }}</p>
        </div>
    </section>

    <form class="form" method="post" action="{% url 'erhebungen:spielen' teilnahme_link=stichprobe.teilnahme_link %}">
        {% csrf_token %}
        <div class="vignette-form-actions">
            <button class="button" type="submit">Weiter</button>
        </div>
    </form>
</section>
{% endblock %}
