<section class="spracheingabe" data-spracheingabe data-formular-id="{{ formular_id }}" data-eingabe-id="{{ eingabe_id }}" data-tastatureingabe-id="{{ tastatureingabe_id }}" data-transkription-url="{{ transkription_url }}" data-automatisch-absenden="{{ automatisch_absenden }}" data-sitzung-pk="{{ sitzung_pk }}" data-maximale-bytes="{{ aufnahme_maximale_bytes }}" aria-label="{{ aufnahme_titel }}">
    <h2>{{ aufnahme_titel }}</h2>
    <button class="button spracheingabe__steuerung" type="button" aria-pressed="false"{% if deaktiviert %} disabled{% endif %}>Spracheingabe starten</button>
    <p class="spracheingabe__status" aria-live="polite">{% if deaktiviert %}{{ deaktiviert_hinweis }}{% else %}{{ aufnahme_hinweis }}{% endif %}</p>
</section>
