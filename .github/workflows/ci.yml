name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python-Version kommt aus .python-version.
      - uses: astral-sh/setup-uv@v6

      - run: uv sync

      # config/settings.py liest SECRET_KEY aus .env; der Platzhalter aus
      # .env.example genügt für die Tests.
      - run: cp .env.example .env

      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pytest
