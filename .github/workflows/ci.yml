name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python-Version kommt aus .python-version.
      - uses: astral-sh/setup-uv@v6

      # --locked: Passt uv.lock nicht zu pyproject.toml, scheitert die CI,
      # statt den Lock still zu aktualisieren.
      - run: uv sync --locked

      # config/settings.py liest SECRET_KEY aus .env; der Platzhalter aus
      # .env.example genügt für die Tests.
      - run: cp .env.example .env

      - run: uv run ruff format --check
      - run: uv run ruff check
      # Dateiliste wie in .githooks/pre-commit.
      - run: uv run mdformat --check README.md docs/verhalten.md docs/DEPLOYMENT.md

      # Fehlt eine Migration zu einer Model-Änderung, scheitert die CI.
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest

      # Schwachstellen-Audit der Produktivabhängigkeiten wie in
      # docs/DEPLOYMENT.md. Der Export läuft als eigener Befehl statt in
      # <(…): Dort ginge sein Fehlschlag an bash -e vorbei, und pip-audit
      # meldete über die leere Liste grün.
      - run: |
          uv export --frozen --no-dev --group deploy --no-hashes > "$RUNNER_TEMP/requirements.txt"
          uvx --python 3.14 pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/requirements.txt"

      # ty läuft vorerst nur beratend: Befunde sind sichtbar, scheitern lässt
      # der Schritt die CI nicht (Spec #336, Ticket #347).
      - run: uv run ty check
        continue-on-error: true
