name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python-Version kommt aus .python-version.
      - uses: astral-sh/setup-uv@v6

      - run: uv sync

      # config/settings.py liest SECRET_KEY aus .env; der Platzhalter aus
      # .env.example genügt für die Tests.
      - run: cp .env.example .env

      - run: uv run ruff format --check
      - run: uv run ruff check
      # Dateiliste wie in .githooks/pre-commit.
      - run: uv run mdformat --check README.md docs/verhalten.md docs/DEPLOYMENT.md

      # Fehlt eine Migration zu einer Model-Änderung, scheitert die CI.
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest

      # ty läuft vorerst nur beratend: Befunde sind sichtbar, scheitern lässt
      # der Schritt die CI nicht (Spec #336, Ticket #347).
      - run: uv run ty check
        continue-on-error: true
