# mdformat prüft nur die hart auf 80 Zeichen umbrochenen Dateien, die Agenten
# laufend ändern (Liste in .githooks/pre-commit und der CI). Die übrigen
# Markdown-Dateien schreiben einen Absatz pro Zeile.
wrap = 80
number = true
# Agent-Dateien tragen YAML-Frontmatter, das mdformat zu einer Überschrift
# zerlegt.
exclude = [".claude/**"]
